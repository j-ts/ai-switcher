name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # Reusable: release.yml calls this with `uses: ./.github/workflows/ci.yml`
  # so the release pipeline gates on the exact same test matrix without
  # copy-pasting it. Nightly depends on CI via workflow_run (decoupled).
  workflow_call: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node --test

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build agm for this runner (pinned commit)
        run: node packaging/build-agm.mjs --targets current --install

      - name: Bootstrap smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          .\Claude.bat --list-profiles || exit /b 1

      - name: Bootstrap smoke-test (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x claude.sh
          ./claude.sh --list-profiles

      - name: ais smoke-test (Unix)
        if: runner.os != 'Windows'
        env:
          CLAUDE_PROFILES_ROOT: ${{ runner.temp }}/ais-profiles
        run: |
          set -eu
          ./bin/ais --version
          ./bin/ais agm --help >/dev/null
          ./bin/ais profile add main --no-login
          ./bin/ais profile add second --no-login
          ./bin/ais use second
          ./bin/ais next claude
          ./bin/ais status --json | node -e '
            const s = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (s.active.claude !== "main" || s.active.codex !== "second") { console.error(s.active); process.exit(1); }'
          if ./bin/ais use nobody 2>/dev/null; then echo "unknown profile accepted"; exit 1; fi

      - name: ais smoke-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLAUDE_PROFILES_ROOT: ${{ runner.temp }}\ais-profiles
        run: |
          $ErrorActionPreference = 'Stop'
          function ais { cmd.exe /c "bin\ais.cmd $args"; if ($LASTEXITCODE) { throw "ais $args exited $LASTEXITCODE" } }
          ais --version
          ais agm --help | Out-Null
          ais profile add main --no-login
          ais profile add second --no-login
          ais use second
          ais next claude
          $s = (cmd.exe /c "bin\ais.cmd status --json") | ConvertFrom-Json
          if ($s.active.claude -ne 'main' -or $s.active.codex -ne 'second') { throw "unexpected active: $($s.active)" }
          cmd.exe /c "bin\ais.cmd use nobody" 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'unknown profile accepted' }
          exit 0   # the runner would otherwise report that expected failure's exit code
